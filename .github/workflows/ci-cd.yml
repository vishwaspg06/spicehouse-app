name: Test, build, deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci && npm test
        working-directory: api
      - run: npm ci && npm run build
        working-directory: web
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.vars.outputs.prefix }}/web:${{ github.sha }}
  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "DEPLOY_TARGET=$DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Create deployment directory
        run: ssh -o StrictHostKeyChecking=yes "$DEPLOY_TARGET" "mkdir -p ~/spicehouse"
      - name: Upload deployment files
        run: scp -o StrictHostKeyChecking=yes compose.yaml deploy/remote.sh "$DEPLOY_TARGET:~/spicehouse/"
      - name: Deploy and verify
        env:
          IMAGE_PREFIX: ${{ needs.publish.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: ssh -o StrictHostKeyChecking=yes "$DEPLOY_TARGET" "cd ~/spicehouse && bash remote.sh '$IMAGE_PREFIX' '$IMAGE_TAG'"
